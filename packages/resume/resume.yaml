    repoUrl: "https://github.com/beautiful-source/vue3-kakao-maps"
    techStack:
      - "Vue"
      - "TypeScript"
      - "Vite"
    oneLiner: "카카오맵 API를 Vue 3 컴포넌트로 사용할 수 있게 만든 오픈소스 라이브러리"
    metrics:
      - label: "적용 범위"
        value: "npm 공개 패키지 · 월 다운로드 약 500회"

    keyContributions:
      - title: "라이브러리의 지원 범위를 산출물 기준으로 정의하고, 기능 추가가 이를 깨지 않게 설계"
        problem: "Vue를 번들에서 제외하면서 peerDependencies에는 선언하지 않아, 사용자는 어떤 Vue 버전에서 동작하는지 알 수 없었습니다."
        decision: "라이브러리가 어떤 Vue 버전에서 동작하는지를, 개발에 쓰는 Vue 버전이 아니라 빌드된 코드가 실제로 호출하는 Vue 함수를 기준으로 정했습니다(Vue 3.2 이상). 이후 `v-model`을 추가할 때 `defineModel`을 쓰면 빌드된 코드가 Vue 3.3부터 있는 함수를 호출하게 되는 것을 확인하고, 3.2 사용자가 깨지지 않도록 같은 기능을 `props`와 `update` 이벤트로 직접 구현했습니다. 공개 API가 바뀌는 변경은 PR마다 명시하고 릴리스 버전 정책에 반영했습니다."
        result: "월 약 500회 다운로드되는 패키지에서, 기존 사용자가 Vue를 업그레이드하지 않고도 새 기능을 쓸 수 있게 했습니다."
        alternatives:
          - option: "지원 하한을 3.4로 올리기"
            whyNot: "기능 하나를 위해 기존 사용자에게 업그레이드를 강요하게 됩니다."

